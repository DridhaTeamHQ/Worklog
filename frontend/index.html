<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Internal employee task management and daily work reporting portal." />
    <title>Taskr</title>
    <!--
      Audiowide is used by the sign-in headline alone, which is deliberately kept on
      the previous design. Nothing else in the app loads a web font.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      Applied before first paint, so a dark-mode user never sees a white flash while
      the bundle loads. Deliberately inline and dependency-free: anything imported
      would arrive too late to matter. Mirrors `src/lib/theme.ts`.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('taskr.theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* storage unavailable; the app applies it on mount */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
