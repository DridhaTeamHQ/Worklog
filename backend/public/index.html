<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Taskr API</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #fcf2f7; color: #2c222a; text-align: center; padding: 2rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      h1 { margin: 0 0 .5rem; font-size: 1.25rem; color: #601d49; }
      p { margin: 0 0 1rem; color: #71606b; font-size: .9rem; }
      a { color: #a33e63; }
      code { background: #f8e4ee; padding: .15rem .4rem; border-radius: .35rem; }
    </style>
  </head>
  <body>
    <!--
      Vercel refuses to finish a build that produces no output directory, and an
      API-only project has nothing static to emit. This page is that output: it keeps
      the build honest and gives the bare domain something better than a 404 for
      anyone who opens it by hand. The application itself is deployed separately.
    -->
    <main>
      <h1>Taskr API</h1>
      <p>This host serves the API only. The web app is deployed separately.</p>
      <p>Health check: <a href="/api/health"><code>/api/health</code></a></p>
    </main>
  </body>
</html>
